AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Weekly meetings report: EventBridge Scheduler → SQS → report-builder Lambda
  (in the VPC, writes to S3 via a Gateway endpoint) → S3 ObjectCreated →
  report-mailer Lambda (outside VPC, sends the CSV by email through SES).
  Everything is tagged with PROJECT_NAME for Cost Explorer.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  # --- Shared with the backend stack ----------------------------------------
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Same VPC as the backend.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      The same subnets the backend function uses (default-for-az subnets in
      the default VPC). The S3 Gateway endpoint attaches to their route tables.

  SubnetRouteTableIds:
    Type: CommaDelimitedList
    Description: >-
      Route-table IDs for the subnets above (one per subnet). The S3 Gateway
      endpoint adds a route to each of them. Look them up with:
        aws ec2 describe-route-tables --filters Name=vpc-id,Values=<vpc>
            --query 'RouteTables[?Associations[?SubnetId!=null]].RouteTableId'

  BuilderSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The security group already used by the backend Lambda (FunctionSecurityGroup
      from the backend stack). The builder reuses it so no new SG is needed.

  ImageUri:
    Type: String
    Description: >-
      The same backend container image the API Lambda uses, pinned by digest.
      The builder reuses the image and overrides only the handler command.

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: >-
      postgresql+asyncpg://… connection string (same as the API Lambda uses).
      Copy the DATABASE_URL environment variable from the backend function.

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

  # --- Reports-specific ------------------------------------------------------
  ReportRecipients:
    Type: String
    Description: >-
      Comma-separated list of email addresses to send the report to. Every
      address must be verified in SES (sandbox) or on the verified domain.

  SenderEmail:
    Type: String
    Description: >-
      The From address, e.g. reports@yourdomain.com. Must be on a domain whose
      SES identity is verified in this stack (or verified separately).

  ScheduleExpression:
    Type: String
    Default: "cron(0 7 ? * MON *)"
    Description: >-
      EventBridge Scheduler expression. Default fires at 07:00 every Monday
      (Europe/Kyiv). Set to rate(5 minutes) to test without waiting for Monday,
      then change it back.

  ScheduleTimezone:
    Type: String
    Default: Europe/Kyiv

Resources:

  # ---------------------------------------------------------------------------
  # S3 bucket for the reports
  # ---------------------------------------------------------------------------

  ReportsBucket:
    Type: AWS::S3::Bucket
    # The bucket DependsOn the mailer's permission so CloudFormation can
    # attach the notification without a circular dependency (the permission
    # uses a hard-coded ARN instead of !GetAtt Bucket.Arn).
    DependsOn: MailerS3Permission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      # Private: no public access
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      # Notify the mailer whenever a CSV lands in reports/
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "reports/"
                  - Name: suffix
                    Value: ".csv"
            Function: !GetAtt MailerFunction.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # S3 VPC Gateway endpoint — lets the builder (in the VPC, no NAT) reach S3
  # ---------------------------------------------------------------------------

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref SubnetRouteTableIds

  # ---------------------------------------------------------------------------
  # SQS queue (report-requests) with a dead-letter queue
  # ---------------------------------------------------------------------------

  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      # Must be >= 6 × builder timeout (6 × 90 s = 540 s).
      VisibilityTimeout: 540
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # IAM roles
  # ---------------------------------------------------------------------------

  # Role for the EventBridge Scheduler to put messages on SQS
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-to-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Role for the builder Lambda
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs + VPC network interfaces
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        # SQS event source mapping (ReceiveMessage, DeleteMessage, GetQueueAttributes)
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: write-reports-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Role for the mailer Lambda
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-reports-and-send-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # CloudWatch log groups (created before the functions so retention is set)
  # ---------------------------------------------------------------------------

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Report-builder Lambda (in VPC, same image as the API, different handler)
  # ---------------------------------------------------------------------------

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Queries Aurora and writes a weekly CSV to S3
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt BuilderRole.Arn
      MemorySize: 512
      # 90 s: Aurora may need ~15 s to resume, leave plenty of room.
      Timeout: 90
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BuilderSecurityGroupId
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          APP_TIMEZONE: !Ref AppTimezone
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # SQS → builder event source mapping (BatchSize 1: one report per invocation)
  BuilderEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !GetAtt BuilderFunction.Arn
      BatchSize: 1
      # Start only when the queue has a message (no polling cost at idle)
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # EventBridge Scheduler → SQS (replaces the old direct invocation)
  # ---------------------------------------------------------------------------

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      Description: Sends a report-request to SQS every Monday morning
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # The builder handler checks for "source": "schedule" to log the trigger.
        Input: '{"week": null, "source": "schedule"}'

  # ---------------------------------------------------------------------------
  # Report-mailer Lambda (outside VPC, reads S3, sends email via SES)
  # ---------------------------------------------------------------------------

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Sends the weekly CSV as an email attachment via SES
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          REPORT_RECIPIENTS: !Ref ReportRecipients
          SENDER_EMAIL: !Ref SenderEmail
          LOG_LEVEL: INFO
      # Inline code: small enough to keep here, avoids a separate zip upload.
      Code:
        ZipFile: |
          """Report-mailer Lambda: triggered by S3 ObjectCreated on the reports prefix."""
          from __future__ import annotations
          import email.message
          import json
          import logging
          import os

          import boto3

          log = logging.getLogger(__name__)
          logging.basicConfig(level=os.environ.get("LOG_LEVEL", "INFO"))

          RECIPIENTS = [r.strip() for r in os.environ.get("REPORT_RECIPIENTS", "").split(",") if r.strip()]
          SENDER    = os.environ.get("SENDER_EMAIL", "")


          def detect_trigger(event: dict) -> str:
              if "Records" in event:
                  src = event["Records"][0].get("eventSource", "")
                  if "s3" in src:
                      return "s3"
              return "unknown"


          def handler(event: dict, context) -> None:
              trigger = detect_trigger(event)
              record  = event["Records"][0]["s3"]
              bucket  = record["bucket"]["name"]
              key     = record["object"]["key"]

              log.info("report-mailer triggered", extra={"trigger": trigger, "bucket": bucket, "key": key})

              if not RECIPIENTS:
                  log.warning("REPORT_RECIPIENTS is empty — nothing to send")
                  return
              if not SENDER:
                  log.warning("SENDER_EMAIL is empty — cannot send")
                  return

              # Download the CSV
              s3   = boto3.client("s3")
              resp = s3.get_object(Bucket=bucket, Key=key)
              csv_bytes = resp["Body"].read()

              week = key.split("/")[-1].replace(".csv", "")  # e.g. "2026-W40"

              # Build a MIME message with the CSV attached
              msg = email.message.EmailMessage()
              msg["Subject"] = f"Weekly meetings report — {week}"
              msg["From"]    = SENDER
              msg["To"]      = ", ".join(RECIPIENTS)
              msg.set_content(
                  f"Hi,\n\nPlease find the weekly meetings report for {week} attached.\n\nThis email was sent automatically.\n"
              )
              msg.add_attachment(
                  csv_bytes,
                  maintype="text",
                  subtype="csv",
                  filename=f"meetings-{week}.csv",
              )

              sesv2 = boto3.client("sesv2")
              sesv2.send_email(
                  Content={"Raw": {"Data": msg.as_bytes()}},
              )
              log.info("email sent", extra={"week": week, "recipients": RECIPIENTS})
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Allow S3 to invoke the mailer when it fires the ObjectCreated notification.
  # Uses the hard-coded bucket name (not !GetAtt) to avoid a circular dependency.
  MailerS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------------------
  # SES email identity (domain-level; outputs DKIM tokens to add as CNAMEs)
  # ---------------------------------------------------------------------------
  # NOTE: if you do not have a custom domain, comment out SesEmailIdentity and
  # instead verify your personal email manually in the SES console.
  # SesEmailIdentity:
  #   Type: AWS::SES::EmailIdentity
  #   Properties:
  #     EmailIdentity: !Select [1, !Split ["@", !Ref SenderEmail]]

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
    Description: S3 bucket where reports are stored

  ReportRequestsQueueUrl:
    Value: !Ref ReportRequestsQueue
    Description: Send a message here to trigger a report on demand

  ReportRequestsQueueArn:
    Value: !GetAtt ReportRequestsQueue.Arn

  DeadLetterQueueUrl:
    Value: !Ref ReportRequestsDlq
    Description: Failed report requests end up here after 3 attempts

  BuilderFunctionName:
    Value: !Ref BuilderFunction

  MailerFunctionName:
    Value: !Ref MailerFunction

