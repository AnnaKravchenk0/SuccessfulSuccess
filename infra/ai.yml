AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Paste-an-agenda parser: Lambda (outside VPC) with a public Function URL.
  Verifies Cognito, calls Claude on Bedrock Mantle, returns structured JSON.
  The model never writes to Aurora — Save goes through the main API.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  ImageUri:
    Type: String
    Description: >-
      The same backend container image the API Lambda uses, pinned by digest.
      The parser reuses the image and overrides only the handler command.

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

  ParserModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Claude Haiku 4.5 Bedrock Runtime US inference profile (PARSER_MODEL).

  CognitoUserPoolId:
    Type: String
    Description: Cognito user pool whose access tokens the parser accepts.

  CognitoClientId:
    Type: String
    Description: App client id that must match the access token's client_id.

  CorsOrigins:
    Type: CommaDelimitedList
    Description: >-
      Allowed browser origins for the Function URL CORS config
      (CloudFront site URL, localhost, …).

  BudgetAlertEmail:
    Type: String
    Description: Email that receives the $5/month AWS Budgets alarm.

Resources:

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-runtime-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Narrowing the resource is a discussion question in the lab.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Parses pasted agenda text with Claude on Bedrock Runtime
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt ParserRole.Arn
      MemorySize: 512
      Timeout: 30
      # No VpcConfig: needs public internet for Bedrock Runtime (and Cognito JWKS).
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CORS_ORIGINS: !Join [",", !Ref CorsOrigins]
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowCredentials: false
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - POST
        AllowOrigins: !Ref CorsOrigins
        MaxAge: 86400

  ParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Cheapest insurance: email when monthly account spend crosses $5.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly-5usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  ParserUrl:
    Description: Base URL of the agenda parser (Function URL, no trailing slash)
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt ParserFunctionUrl.FunctionUrl]]
  FunctionName:
    Value: !Ref ParserFunction
  LogGroupName:
    Value: !Ref ParserLogGroup
