AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC Role for SuccessfulSuccess

Parameters:
  GitHubOrg:
    Type: String
    Default: AnnaKravchenk0
    Description: GitHub organization or username
  GitHubRepo:
    Type: String
    Default: SuccessfulSuccess
    Description: GitHub repository name

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c3d597182a000c55b6d021f907d2ef13725b804

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: successfulsuccess-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  RoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
    Description: ARN of the IAM Role for GitHub Actions